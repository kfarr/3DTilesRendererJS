<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame 3D Tiles Example</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@32756620305cb66113b376e2cbf8c61f87911db2/dist/aframe-master.min.js"></script>
    <script src="../dist/aframe-3d-tiles-renderer.umd.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <a-scene>
      <!-- Camera -->
      <a-entity position="0 2 5">
        <a-camera></a-camera>
      </a-entity>

      <!-- 3D Tiles -->
      <a-entity 
        3d-tiles="url: https://raw.githubusercontent.com/NASA-AMMOS/3DTilesRendererJS/master/example/tileset.json;
                  maximumSSE: 16;
                  errorTarget: 6;
                  maxDepth: 8">
      </a-entity>

      <!-- Environment -->
      <a-sky color="#ECECEC"></a-sky>
      <a-grid></a-grid>
    </a-scene>
  </body>
</html>
