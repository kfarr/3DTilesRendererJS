<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Google Maps Aerial Example</title>
    <meta name="description" content="A-Frame Google Maps Aerial Example">
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@32756620305cb66113b376e2cbf8c61f87911db2/dist/aframe-master.min.js"></script>
    <script src="./aframe-google-maps-aerial.js" type="module"></script>
    <style>
      body { margin: 0; }
      .info {
        position: fixed;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: Arial, sans-serif;
        pointer-events: none;
        text-shadow: 0 0 5px black;
      }
    </style>
  </head>
  <body>
    <div class="info">
      A-Frame Google Maps Aerial Example - Tokyo Tower
    </div>
    <a-scene renderer="logarithmicDepthBuffer: false;">
      <!-- Camera -->
      <a-entity position="0 1.6 0" camera="near: 0.1; far: 10000" look-controls wasd-controls="fly: true; acceleration: 250">
        <!-- <a-entity cursor="rayOrigin: mouse"></a-entity> -->
      </a-entity>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder
        position="1 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
      <!-- Google Maps Aerial -->
      <a-entity google-maps-aerial="
        apiToken: AIzaSyAKveHaNwJJTESz_MMUY8wxtmRKfdFfQhk;
        latitude: 37.795;
        longitude: -122.394;
        minDistance: 500;
        maxDistance: 20000;
        ellipsoidalHeight: -29.605;
      "></a-entity>

    </a-scene>
  </body>
</html>
